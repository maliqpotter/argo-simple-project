apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-game-ingress
  namespace: default
  labels:
    app: demo-game
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-game-service
            port:
              number: 80
